services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-dogshop}
      WORDPRESS_DB_USER: ${DB_USER:-dogshop}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in Dokploy}
    volumes:
      - wordpress_data:/var/www/html
    expose:
      - "80"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dogshop}
      MYSQL_USER: ${DB_USER:-dogshop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD in Dokploy}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Configure DB_ROOT_PASSWORD in Dokploy}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  wordpress_data:
  database_data:
